<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <meta name="description" content="Turn the Bootstrap breakpoint indicator on or off and choose Bootstrap 4, 5 or 6." />
    <title>Bootstrap CSS Breakpoint Indicator</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body class="is-pending">
    <main>
      <h1>Breakpoint indicator</h1>
      <p id="indicator-status" class="hint">Off until you turn it on.</p>
      <div class="form-field">
        <input id="enabled" class="check check-sm" type="checkbox" />
        <label for="enabled">Show breakpoint</label>
      </div>
      <fieldset>
        <legend>Bootstrap version</legend>
        <div class="form-field">
          <input id="bootstrap-4" class="radio radio-sm" type="radio" name="version" value="4" />
          <label for="bootstrap-4">Bootstrap 4</label>
        </div>
        <div class="form-field">
          <input id="bootstrap-5" class="radio radio-sm" type="radio" name="version" value="5" checked="checked" />
          <label for="bootstrap-5">Bootstrap 5</label>
        </div>
        <div class="form-field">
          <input id="bootstrap-6" class="radio radio-sm" type="radio" name="version" value="6" />
          <label for="bootstrap-6">Bootstrap 6</label>
        </div>
      </fieldset>
      <hr />
      <div class="form-field">
        <input id="color" class="check check-sm" type="checkbox" />
        <label for="color">Differentiate with color</label>
      </div>
    </main>
    <script src="toolbar-icon.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
